name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3776AB&color_dots=#ebedf0,#c6dbef,#9ecae1,#4292c6,#08519c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5a9fd4&color_dots=#161b22,#0e2a47,#174a7c,#2f6fb0,#5a9fd4

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update snake"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
